name: plakyab
description: "Vehicle Information & Diagnostics Platform - Flutter Mobile Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^12.0.0

  # HTTP Client
  dio: ^5.3.0
  dio_http_cache: ^2.0.0

  # Database & Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # UI & Design
  flutter_material_3_package: ^1.0.0
  animations: ^2.0.0
  gap: ^3.0.0
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Internationalization
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0

  # Validation
  validators: ^4.1.0

  # Notifications
  firebase_core: ^2.23.0
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^16.1.0

  # Analytics
  firebase_analytics: ^10.8.0

  # Logging
  logger: ^2.1.0

  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0

  # Date/Time
  intl: ^0.19.0

  # Device Info
  device_info_plus: ^9.1.0
  connectivity_plus: ^5.0.0

  # QR Code
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0

  # PDF Export
  pdf: ^3.10.0
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0
  analysis_options: ^5.2.0

  # Testing
  mockito: ^5.4.0
  build_runner: ^2.4.0

  # Code Generation
  json_serializable: ^6.7.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Localization
  generate: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/locales/
